name: One-time transport dependency patch regeneration

on:
  push:
    branches:
      - security/oct-2026-hardening
    paths:
      - .github/workflows/security-autofix-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Regenerate lockfile using npm advisory fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci --ignore-scripts
          python -m pip install --requirement requirements.txt
          npm run validate
      - name: Commit updated dependency lockfile to security branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: apply npm-supported transport advisory fixes'
            git push origin HEAD:security/oct-2026-hardening
          fi
