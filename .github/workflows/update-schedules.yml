name: Actualizar horarios de trenes

on:
  schedule:
    - cron: '0 3 * * *'   # Todos los días a las 3:00 AM UTC
  workflow_dispatch:       # Permite ejecución manual desde la interfaz

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests pandas pyyaml

      - name: Ejecutar script
        run: python scripts/update_trenes.py

      - name: Commit y push si hay cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Trenes/
          git diff --staged --quiet || git commit -m "Actualización automática de horarios de trenes [skip ci]"
          git push