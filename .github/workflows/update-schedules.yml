name: Actualizar cronogramas

on:
  schedule:
    # 06:17 de Argentina (UTC-3). El minuto no redondo reduce demoras del scheduler.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Reconstruir horarios.db y horarios.csv aunque no cambien los XLSX
        required: false
        default: false
        type: boolean
      force_catalog:
        description: Forzar el refresco de los catálogos SOFSE y SUBE
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-schedules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Argentina/Buenos_Aires

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Probar conector SOFSE para la web
        run: node --test scripts/sofse_api.test.mjs

      - name: Restaurar caché GTFS
        uses: actions/cache@v4
        with:
          path: .cache/gtfs
          key: gtfs-${{ runner.os }}-${{ hashFiles('config/pipeline.json') }}

      - name: Ejecutar conector SOFSE
        id: sofse
        continue-on-error: true
        shell: bash
        env:
          FORCE_CATALOG: ${{ inputs.force_catalog || 'false' }}
        run: |
          args=(--stage connector --connector sofse --report .pipeline/sofse.json)
          if [ "$FORCE_CATALOG" = "true" ]; then
            args+=(--force-catalog)
          fi
          python scripts/run_pipeline.py "${args[@]}"

      - name: Descartar actualización SOFSE incompleta
        if: steps.sofse.outcome == 'failure'
        run: |
          git restore -- Horarios/Trenes
          git clean -fd -- Horarios/Trenes

      - name: Ejecutar conector Cuándo SUBO
        id: sube
        continue-on-error: true
        shell: bash
        env:
          FORCE_CATALOG: ${{ inputs.force_catalog || 'false' }}
        run: |
          args=(--stage connector --connector cuando_subo --report .pipeline/cuando-subo.json)
          if [ "$FORCE_CATALOG" = "true" ]; then
            args+=(--force-catalog)
          fi
          python scripts/run_pipeline.py "${args[@]}"

      - name: Descartar actualización SUBE incompleta
        if: steps.sube.outcome == 'failure'
        run: |
          git restore -- Horarios/Colectivos
          git clean -fd -- Horarios/Colectivos

      - name: Aplicar cronogramas públicos curados
        id: curated
        continue-on-error: true
        run: >-
          python scripts/run_pipeline.py
          --stage connector
          --connector curated_public
          --report .pipeline/curated-public.json

      - name: Crear sólo XLSX ausentes mediante fallback GTFS
        id: gtfs
        if: always()
        continue-on-error: true
        run: >-
          python scripts/run_pipeline.py
          --stage fallback
          --report .pipeline/gtfs.json

      - name: Resumir estado de conectores
        if: always()
        shell: bash
        run: |
          {
            echo "## Pipeline de cronogramas"
            echo ""
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| SOFSE | ${{ steps.sofse.outcome }} |"
            echo "| SUBE / Cuándo SUBO | ${{ steps.sube.outcome }} |"
            echo "| Referencias públicas curadas | ${{ steps.curated.outcome }} |"
            echo "| GTFS sólo para XLSX ausentes | ${{ steps.gtfs.outcome }} |"
            echo ""
            echo "Las fuentes vivas se ejecutan de forma independiente. Las referencias curadas preservan una grilla API igual o más nueva. GTFS jamás sobrescribe un XLSX existente."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decidir si deben reconstruirse las salidas
        id: changes
        if: always()
        shell: bash
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          if [ -n "$(git status --porcelain -- Horarios)" ] || [ ! -f horarios.db ] || [ ! -f 'BD CSV/horarios.csv' ] || [ "$FORCE_REBUILD" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Los XLSX no cambiaron; se conservan SQLite y CSV existentes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reconstruir y validar SQLite y CSV
        if: steps.changes.outputs.rebuild == 'true'
        run: >-
          python scripts/run_pipeline.py
          --stage outputs
          --report .pipeline/outputs.json

      - name: Verificar que exista al menos una salida utilizable
        if: always()
        shell: bash
        run: |
          test -s horarios.db
          test -s 'BD CSV/horarios.csv'

      - name: Commit y push si hay cambios
        shell: bash
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ramales.xlsx Horarios horarios.db 'BD CSV/horarios.csv'
          if git diff --staged --quiet; then
            echo "No hubo cambios publicables." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Actualizar cronogramas de transporte [skip ci]"
          git push
