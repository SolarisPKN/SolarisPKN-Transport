name: Actualizar cronogramas

on:
  schedule:
    # 06:17 de Argentina (UTC-3). El minuto no redondo reduce demoras del scheduler.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Reconstruir horarios.db aunque los XLSX no hayan cambiado
        required: false
        default: false
        type: boolean
      force_catalog:
        description: Forzar el refresco completo de Lista de ramales
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-schedules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Argentina/Buenos_Aires

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Probar conector SOFSE para la web
        run: node --test scripts/sofse_api.test.mjs

      - name: Refrescar catálogo de ramales si venció
        shell: bash
        env:
          FORCE_CATALOG: ${{ inputs.force_catalog || 'false' }}
        run: |
          if [ "$FORCE_CATALOG" = "true" ]; then
            python scripts/update_route_catalog.py --force
          else
            python scripts/update_route_catalog.py
          fi

      - name: Leer ramales.xlsx y actualizar cronogramas seguros
        run: python scripts/update_schedules.py

      - name: Decidir si debe reconstruirse SQLite
        id: changes
        shell: bash
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          if [ -n "$(git status --porcelain -- Horarios)" ] || [ ! -f horarios.db ] || [ "$FORCE_REBUILD" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Los XLSX no cambiaron; se conserva la base existente." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reconstruir y validar SQLite
        if: steps.changes.outputs.rebuild == 'true'
        run: python procesar_horarios.py --rebuild --strict

      - name: Commit y push si hay cambios
        shell: bash
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ramales.xlsx Horarios horarios.db
          if git diff --staged --quiet; then
            echo "No hubo cambios publicables." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Actualizar cronogramas de transporte [skip ci]"
          git push
